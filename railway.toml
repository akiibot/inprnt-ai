# Railway deployment config for Imprnt AI backend
# Railway auto-detects this file and uses the Dockerfile in backend/

[build]
  dockerfilePath = "backend/Dockerfile"
  watchPatterns = ["backend/**"]

[deploy]
  # Intentionally NO startCommand — Railway runs Dockerfile CMD overrides in
  # exec form, which would pass `$PORT` as a literal string and crash uvicorn
  # with "Invalid value for '--port': '$PORT' is not a valid integer".
  # The Dockerfile's CMD already uses `sh -c` for proper variable expansion.
  healthcheckPath = "/api/health"
  healthcheckTimeout = 60
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3
